<script>
var PDFPROC=(function(){
function stripSubset(n){return String(n||'').replace(/^[A-Z]{6}\+/,'')}
function hlPix(r,g,b){
var mx=Math.max(r,g,b),mn=Math.min(r,g,b);
return mn>=100&&mx>=230&&(mx-mn)>=70;
}
function hlColor(r,g,b){
if(r<g-40&&r<b-40)return 'cyan';
if(b<r-40&&b<g-40)return 'yellow';
if(g<r-40&&g<b-40)return 'pink';
if(r<b-40&&b>=r&&g>=r)return 'cyan';
if(r<g-40&&b<g-40)return 'green';
return 'other';
}
function splitWords(str){
var out=[],re=/\S+/g,m;
while((m=re.exec(str)))out.push({s:m[0],i:m.index,e:m.index+m[0].length});
return out;
}
async function pageWords(page,vp){
var tc=await page.getTextContent();
await page.getOperatorList();
var fonts={},items=[];
tc.items.forEach(function(it){
if(!it.str||!it.str.trim())return;
if(!(it.fontName in fonts)){
var nm='';
try{var f=page.commonObjs.get(it.fontName);nm=stripSubset(f&&(f.name||f.loadedName))}catch(e){}
fonts[it.fontName]=nm;
}
if(fonts[it.fontName].charAt(0)==='.')return;
var tx=it.transform,h=Math.abs(it.height)||Math.hypot(tx[2],tx[3])||10,x=tx[4],y=tx[5],w=it.width||(it.str.length*h*0.5);
var top=vp.height-(y+h*0.85),bottom=vp.height-(y-h*0.2);
var words=splitWords(it.str),n=Math.max(it.str.length,1);
items.push({str:it.str,left:x,right:x+w,top:top,bottom:bottom,words:words.map(function(wd){return {s:wd.s,left:x+w*wd.i/n,right:x+w*wd.e/n,top:top,bottom:bottom,hl:false,col:''}})});
});
return items;
}
function markHighlights(items,img,scale){
var W=img.width,H=img.height,d=img.data,total=0,hit=0,step=7;
for(var i=0;i<W*H;i+=step){total++;var o=i*4;if(hlPix(d[o],d[o+1],d[o+2]))hit++}
if(total&&hit/total>0.25)return 0;
var n=0;
items.forEach(function(it){
it.words.forEach(function(w){
var x0=Math.max(0,Math.floor(w.left*scale)),x1=Math.min(W,Math.ceil(w.right*scale)),y0=Math.max(0,Math.floor(w.top*scale)),y1=Math.min(H,Math.ceil(w.bottom*scale));
if(x1<=x0||y1<=y0)return;
var cnt=0,rowsOK=0,cr=0,cg=0,cb=0,wd=x1-x0;
for(var y=y0;y<y1;y++){
var rc=0;
for(var x=x0;x<x1;x++){
var o=(y*W+x)*4,r=d[o],g=d[o+1],b=d[o+2];
if(hlPix(r,g,b)){rc++;cr+=r;cg+=g;cb+=b}
}
cnt+=rc;
if(rc/wd>=0.35)rowsOK++;
}
if(cnt&&rowsOK>=Math.max(2,0.1*(y1-y0))){w.hl=true;w.col=hlColor(cr/cnt,cg/cnt,cb/cnt);n++}
});
});
return n;
}
function buildLines(items){
var its=items.slice().sort(function(a,b){return (a.top-b.top)||(a.left-b.left)});
var lines=[];
its.forEach(function(it){
var h=it.bottom-it.top,cur=lines[lines.length-1];
if(cur&&Math.abs(it.top-cur.top)<h*0.5)cur.items.push(it);
else lines.push({top:it.top,items:[it]});
});
return lines.map(function(l){
l.items.sort(function(a,b){return a.left-b.left});
var ws=[];l.items.forEach(function(it){it.words.forEach(function(w){ws.push(w)})});
var txt='',open=false;
ws.forEach(function(w,i){
if(w.hl&&!open){txt+=(i?' ':'')+'\u27e6'+w.s;open=true}
else if(!w.hl&&open){txt+='\u27e7 '+w.s;open=false}
else txt+=(i?' ':'')+w.s;
});
if(open)txt+='\u27e7';
return {text:txt,words:ws};
});
}
function drawImageObj(obj,env){
var w=obj.width,h=obj.height,c=env.makeCanvas(w,h),ctx=c.getContext('2d');
if(obj.bitmap){ctx.drawImage(obj.bitmap,0,0);return c}
var d=obj.data;
if(!d)return null;
var img=ctx.createImageData(w,h),o=img.data;
if(d.length===w*h*4)o.set(d);
else if(d.length===w*h*3){for(var i=0,j=0;i<w*h;i++){o[j++]=d[i*3];o[j++]=d[i*3+1];o[j++]=d[i*3+2];o[j++]=255}}
else return null;
ctx.putImageData(img,0,0);
return c;
}
function toSmallJpeg(src,env){
var w=src.width,h=src.height,m=Math.max(w,h),k=m>640?640/m:1,w2=Math.round(w*k),h2=Math.round(h*k);
var c=env.makeCanvas(w2,h2),ctx=c.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,w2,h2);
ctx.drawImage(src,0,0,w2,h2);
return env.toJpeg(c);
}
function getObj(page,id){
var store=String(id).indexOf('g_')===0?page.commonObjs:page.objs;
return new Promise(function(res){
var done=false;
var t=setTimeout(function(){if(!done){done=true;res(null)}},4000);
try{store.get(id,function(o){if(!done){done=true;clearTimeout(t);res(o)}})}catch(e){if(!done){done=true;clearTimeout(t);res(null)}}
});
}
async function pageImages(pdfjsLib,page,env,seen){
var ops=await page.getOperatorList(),out=[],vp0=page.getViewport({scale:1}),pr=vp0.width/vp0.height;
for(var i=0;i<ops.fnArray.length;i++){
var fn=ops.fnArray[i];
if(fn!==pdfjsLib.OPS.paintImageXObject&&fn!==pdfjsLib.OPS.paintJpegXObject)continue;
var id=ops.argsArray[i][0];
if(seen[id])continue;
seen[id]=1;
var obj=await getObj(page,id);
if(!obj||!obj.width||!obj.height)continue;
if(obj.width<150||obj.height<150)continue;
if(obj.width>=700&&Math.abs(obj.width/obj.height-pr)/pr<0.06)continue;
try{
var c=drawImageObj(obj,env);
if(!c)continue;
out.push({w:obj.width,h:obj.height,uri:toSmallJpeg(c,env)});
}catch(e){}
}
return out;
}
async function extractPdf(pdfjsLib,data,env,onProgress,opts){
opts=opts||{};
var scale=opts.scale||1.5;
var pdf=await pdfjsLib.getDocument({data:data,disableFontFace:true,cMapUrl:opts.cMapUrl,cMapPacked:!!opts.cMapUrl}).promise;
var pages=[],images=[],seen={};
for(var n=1;n<=pdf.numPages;n++){
if(onProgress)onProgress(n,pdf.numPages);
var page=await pdf.getPage(n);
var vp=page.getViewport({scale:1}),vps=page.getViewport({scale:scale});
var items=await pageWords(page,vp);
var hlN=0;
if(items.length){
var c=env.makeCanvas(Math.ceil(vps.width),Math.ceil(vps.height)),ctx=c.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
await page.render({canvasContext:ctx,viewport:vps}).promise;
var img=ctx.getImageData(0,0,c.width,c.height);
hlN=markHighlights(items,img,scale);
c.width=1;c.height=1;
}
var lines=buildLines(items);
var pimgs=opts.noImages?[]:await pageImages(pdfjsLib,page,env,seen);
var idx=[];
pimgs.forEach(function(im){images.push(im.uri);idx.push(images.length-1)});
pages.push({n:n,text:lines.map(function(l){return l.text}).join('\n'),hl:hlN,imgs:idx});
if(page.cleanup)page.cleanup();
}
return {pages:pages,images:images};
}
async function openPdf(pdfjsLib,data,opts){
opts=opts||{};
return pdfjsLib.getDocument({data:data,disableFontFace:true,cMapUrl:opts.cMapUrl,cMapPacked:!!opts.cMapUrl}).promise;
}
async function shot(pdf,n,env,width){
var page=await pdf.getPage(n),vp=page.getViewport({scale:1}),sc=Math.min(2.2,(width||1000)/vp.width),vps=page.getViewport({scale:sc});
var c=env.makeCanvas(Math.ceil(vps.width),Math.ceil(vps.height)),ctx=c.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
await page.render({canvasContext:ctx,viewport:vps}).promise;
var uri=env.toJpeg(c,0.82);
c.width=1;c.height=1;
if(page.cleanup)page.cleanup();
return uri;
}
return {extractPdf:extractPdf,openPdf:openPdf,shot:shot,stripSubset:stripSubset,hlPix:hlPix};
})();

</script>

function shareDeck(d){
var bin=atob(d.b64),u=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
var file=new File([u],d.file,{type:'application/zip'});
if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:d.name});
var url=URL.createObjectURL(file),a=document.createElement('a');
a.href=url;a.download=d.file;document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(url)},4000);
return Promise.resolve();
}

var gIdx={},gKo={};
function gnorm(s){return String(s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/\s+/g,' ').trim()}
function buildIndex(){
gIdx={};gKo={};
(D.glossary||[]).forEach(function(g){
[g.t].concat(g.a||[]).forEach(function(a){var k=gnorm(a);if(k&&!gIdx[k])gIdx[k]=g});
var kk=String(g.k||'').split(/[(\uff08]/)[0].trim();
if(kk.length>=2&&!gKo[kk])gKo[kk]=g;
});
}
function lookupTerm(k){
var u=st.terms&&st.terms[k];
if(u)return {t:k,k:u.k||'',d:u.d,mine:true,ai:!!u.ai};
if(gIdx[k])return gIdx[k];
var alt=[];
if(/ies$/.test(k))alt.push(k.slice(0,-3)+'y');
if(/es$/.test(k))alt.push(k.slice(0,-2));
if(/s$/.test(k))alt.push(k.slice(0,-1));
for(var i=0;i<alt.length;i++){
if(gIdx[alt[i]])return gIdx[alt[i]];
var u2=st.terms&&st.terms[alt[i]];
if(u2)return {t:alt[i],k:u2.k||'',d:u2.d,mine:true,ai:!!u2.ai};
}
return null;
}
function findTerms(text){
var words=(text.match(/[A-Za-z\u03b1\u03b2][A-Za-z0-9\u03b2\-']*/g)||[]).map(function(w){return w.replace(/^[-']+|[-']+$/g,'')}).filter(Boolean);
var out=[],seen={},i=0;
while(i<words.length){
var hit=null,n=0;
for(var len=Math.min(4,words.length-i);len>=1;len--){
var h=lookupTerm(gnorm(words.slice(i,i+len).join(' ')));
if(h){hit=h;n=len;break}
}
if(hit){var key=gnorm(hit.t);if(!seen[key]){seen[key]=1;out.push(hit)}i+=n}else i++;
}
(text.match(/[\uac00-\ud7a3]{2,}/g)||[]).forEach(function(tok){
for(var len=tok.length;len>=2;len--){
var g=gKo[tok.slice(0,len)];
if(g){var key=gnorm(g.t);if(!seen[key]){seen[key]=1;out.push(g)}break}
}
});
return out;
}
function termKey(text){return gnorm(text.replace(/[^A-Za-z0-9\u03b1\u03b2\-' ]+/g,' '))||text.trim()}

var AISYS='너는 한국 의대생을 돕는 의학 용어 설명자야. 학생이 강의 정리본에서 고른 말(영어 용어나 짧은 구절)을 한국어로 설명해. 형식은 첫 줄에 "한글 이름: …", 다음 줄에 "뜻: …"을 1~2문장, 이어서 "핵심:" 아래에 "- "로 시작하는 짧은 줄 2~3개야. 문장 맥락이 주어지면 그 맥락에서의 의미를 우선해. 확실하지 않은 내용은 추측하지 말고 "확실하지 않아요"라고 써. 서론이나 맺음말 없이 간결하게 답해.';
function askTerm(text,sentence,lecture){
return aiCall(AISYS,'강의: '+lecture+'\n문장: '+sentence+'\n찾는 말: '+text,450);
}
function aiErr(er){
if(er&&er.code==='nokey')return '설정 탭의 \u201cAI 연결\u201d에서 API 키를 먼저 저장해주세요.';
if(er&&er.msg&&/credit|balance|quota|billing/i.test(er.msg))return '크레딧이나 사용 한도가 부족한 것 같아요. 결제 설정과 잔액을 확인해주세요.';
if(er&&er.code===401)return 'API 키가 맞지 않아요. 키를 다시 확인해주세요.';
if(er&&er.code===403)return '이 키로는 사용할 수 없어요. 키 권한을 확인해주세요.';
if(er&&er.code===404)return '모델 이름이나 주소를 찾을 수 없어요. 설정 탭의 \u201cAI 연결\u201d에서 모델 이름과 중계 주소를 확인해주세요.';
if(er&&er.code===429)return '요청이 너무 많아요. 잠시 후 다시 해보세요.';
if(er&&er.code==='timeout')return '응답이 너무 오래 걸려요. 다시 시도해주세요.';
if(er&&er.code==='trunc')return 'AI 답이 너무 길어서 중간에 잘렸어요. 다시 시도해주세요.';
if(er&&er.code==='json')return 'AI 답을 읽지 못했어요. 다시 시도해주세요.'+(er.raw?' (응답 앞부분: \u201c'+er.raw+'\u201d)':'');
if(er&&er.code)return '요청에 실패했어요 ('+er.code+'). '+(er.msg||'');
if(aiProv()==='openai')return 'OpenAI로 연결하지 못했어요. 브라우저에서 직접 연결하는 게 막혔을 수 있어요. 그렇다면 중계 주소가 필요해요.';
return '연결하지 못했어요. 인터넷 연결을 확인해주세요.';
}

function hideTb(){var t=$('tb');if(t)t.style.display='none'}
function posTb(){
var t=$('tb'),nb=$('nb');if(!t||!nb||!pend)return;
var els=nb.querySelectorAll('.sel');if(!els.length){hideTb();return}
var a=els[0].getBoundingClientRect(),z=els[els.length-1].getBoundingClientRect(),r=nb.getBoundingClientRect();
t.style.display='block';
var cx=(Math.min(a.left,z.left)+Math.max(a.right,z.right))/2-r.left;
var left=Math.max(0,Math.min(cx-t.offsetWidth/2,r.width-t.offsetWidth));
var top=a.top-r.top-t.offsetHeight-8;

function setPend(sid,s,e){
var old=pend&&pend.sid;
pend={sid:sid,s:s,e:e};

}
function clearPend(){var old=pend&&pend.sid;pend=null;hideTb();if(old)renderSent(old)}
function offIn(root,node,off){var r=document.createRange();r.selectNodeContents(root);r.setEnd(node,off);return r.toString().length}
function addMark(sid,s,e,t,m){
var ms=marksOf(sid);
if(t!=='mm'){
var ns=s,ne=e,keep=[];
ms.forEach(function(x){if(x[2]===t&&x[0]<=ne&&x[1]>=ns){ns=Math.min(ns,x[0]);ne=Math.max(ne,x[1])}else keep.push(x)});
keep.push([ns,ne,t]);st.marks[sid]=keep;
}else ms.push([s,e,'mm',m]);
save();
}
function act(a){
if(!pend)return;
var sid=pend.sid,it=sentById(sid),p=pend,txt=it.t;
if(a==='hl'||a==='st'){addMark(sid,p.s,p.e,a);clearPend();return}
if(a==='clr'){st.marks[sid]=(st.marks[sid]||[]).filter(function(m){return m[1]<=p.s||m[0]>=p.e});save();clearPend();return}
if(a==='all'){setPend(sid,0,txt.length);return}
if(a==='l'){var s=p.s;while(s>0&&/\s/.test(txt[s-1]))s--;while(s>0&&!/\s/.test(txt[s-1]))s--;setPend(sid,s,p.e);return}
if(a==='r'){var e=p.e;while(e<txt.length&&/\s/.test(txt[e]))e++;while(e<txt.length&&!/\s/.test(txt[e]))e++;setPend(sid,p.s,e);return}
if(a==='mm'){
$('tb').innerHTML='<input type="text" id="mt" placeholder="메모 입력"><button data-a="ms">저장</button><button data-a="mc">취소</button><div id="me" style="font-size:12px;color:var(--no);padding:2px 8px;display:none"></div>';
posTb();$('mt').focus();return;
}
if(a==='q'){var tx=txt.slice(p.s,p.e);clearPend();showDict(sid,tx);return}
if(a==='mc'){tbMain();posTb();return}
if(a==='ms'){
var v=$('mt').value.trim();
if(!v){$('me').textContent='메모를 입력하세요';$('me').style.display='block';return}
addMark(sid,p.s,p.e,'mm',v);
clearPend();
}
}

function parseJson(s){

}
function repairJson(s){
var st=[],inStr=false,es=false,cut=-1,cutStack=null;
for(var i=0;i<s.length;i++){
var c=s.charAt(i);
if(inStr){if(es)es=false;else if(c==='\\')es=true;else if(c==='"')inStr=false;continue}
if(c==='"'){inStr=true;continue}
if(c==='{'||c==='[')st.push(c);
else if(c==='}'||c===']'){st.pop();if(c==='}'&&st.length&&st[st.length-1]==='['){cut=i+1;cutStack=st.slice()}}
}
if(cut<0)return null;
var out=s.slice(0,cut);
for(var j=cutStack.length-1;j>=0;j--)out+=cutStack[j]==='['?']':'}';
return out;
}

}else h+='<div class="note" style="margin-top:14px">전부 맞았어요. 내일 다시 볼 문제는 없어요.</div>';
h+='<button class="btn pri full" id="qzx2" style="margin-top:16px">닫기</button>';
}
$('qz').innerHTML=h+'</div>';
}
function qzSubmit(skip){
var it=qz.items[qz.i];
var ans=skip?'':String(($('qza')&&$('qza').value)||qz.draft||'').trim();
qz.draft=ans;
if(!skip&&!ans){qz.hint='답을 적어주세요. 모르면 \u201c모르겠어요\u201d를 눌러요.';qzRender();return}
qz.hint='';
if(skip){qz.res[qz.i]={ok:false,why:'모르겠어요로 넘겼어요.',ans:'',skip:true};qz.stage='graded';qzRender();return}
qz.stage='grading';qzRender();
var qi0=qz.i;
aiJson('문제: '+it.q+'\n모범 답안: '+it.a+'\n핵심 키워드: '+it.key.join(', ')+'\n학생 답: '+ans,QCSYS,400).then(function(j){
if(!qz||qz.i!==qi0)return;
qz.res[qi0]={ok:!!(j&&j.ok===true),why:String((j&&j.why)||'').slice(0,80)||((j&&j.ok===true)?'핵심 내용이 맞아요.':'핵심 내용이 달라요.'),ans:ans};
qz.stage='graded';qzRender();
}).catch(function(er){if(!qz)return;qz.stage='ask';qz.hint='채점하지 못했어요. '+aiErr(er);qzRender()});
}
function qzFinish(){
var lec=lecById(qz.lec),wrong=[];
qz.items.forEach(function(it,i){if(!qz.res[i].ok)wrong.push(it)});
var tm=new Date();tm.setDate(tm.getDate()+1);tm.setHours(6,0,0,0);
var ts=Date.now().toString(36);
wrong.forEach(function(w,i){
var id='qz-'+ts+'-'+i;
D.questions=D.questions.concat([{id:id,lec:lec.id,subject:lec.subject,type:'short',q:w.q,e:w.a,src:'quiz'}]);
st.srs[id]={ivl:1,due:tm.getTime()};
});
save();
if(wrong.length)idbSet('pack',D).catch(function(){});
qz.stage='sum';qzRender();
}
$('p1').addEventListener('input',function(e){if(e.target.id==='edt')edText=e.target.value;if(e.target.id==='edh')edHText=e.target.value});
$('qz').addEventListener('input',function(e){if(e.target.id==='qza'){qz.draft=e.target.value;qz.hint=''}});
$('qz').addEventListener('click',function(e){
var b=e.target.closest('button');
if(!b||!qz)return;
if(b.id==='qzx'){if(qz.stage==='ask'||qz.stage==='graded'||qz.stage==='grading'){qz.stage0=qz.stage;qz.stage='quit';qzRender()}else qzClose();return}
if(b.id==='qzx2'){qzClose();return}
if(b.id==='qzgo'){qz.stage=qz.stage0==='graded'&&qz.res[qz.i]?'graded':'ask';qzRender();return}
if(b.id==='qzquit'){qzClose();return}
if(b.id==='qzretry'){qzGen();return}
if(b.id==='qzsub'){qzSubmit(false);return}
if(b.id==='qzskip'){qzSubmit(true);return}
if(b.id==='qzflip'){var r=qz.res[qz.i];r.ok=!r.ok;r.why=(r.ok?'맞음으로 직접 바꿨어요.':'틀림으로 직접 바꿨어요.');qzRender();return}
if(b.id==='qznext'){
if(qz.i>=qz.items.length-1){qzFinish();return}
qz.i++;qz.draft='';qz.hint='';qz.stage='ask';qzRender();
}
});
var bkMsg='',bkPend=null,bkPackPend=null;
function freshState(){return {ts:0,extra:[],cur:0,marks:{},srs:{},asg:{},pend:{},lec:{},lw:{},names:{},qlec:{},qscope:'all',terms:{},miss:[],sp:{},qa:{},qkind:'all'}}
function bkSummary(s,p){
var m=0,mm=0;
for(var k in (s.marks||{})){(s.marks[k]||[]).forEach(function(x){if(x[2]==='mm')mm++;else m++})}
return '과목 '+((s.extra||[]).length)+'개 · 표시 '+m+'개 · 메모 '+mm+'개 · 복습 기록 '+Object.keys(s.srs||{}).length+'개'+(p?' · 강의 '+(p.lectures||[]).length+'개 · 문제 '+(p.questions||[]).length+'개 · 족보 '+(p.exams||[]).length+'개':'');
}
function exportBackup(){
var json=JSON.stringify({app:'studyapp',v:2,at:Date.now(),st:st,pack:D});
var f=new File([json],'study_backup_'+new Date().toISOString().slice(0,10)+'.txt',{type:'text/plain'});
if(navigator.canShare&&navigator.canShare({files:[f]})){
return navigator.share({files:[f],title:'공부 앱 백업'}).then(function(){bkMsg='백업을 내보냈어요. ('+bkSummary(st,D)+')'}).catch(function(er){if(er&&er.name==='AbortError'){bkMsg='';return}bkMsg='내보내지 못했어요. 다시 시도해주세요.'});
}
try{
var u=URL.createObjectURL(f),a=document.createElement('a');
a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(u)},4000);
bkMsg='백업 파일을 내려받았어요. ('+bkSummary(st,D)+')';
}catch(e){bkMsg='내보내지 못했어요.'}
return Promise.resolve();
}
$('fbk').addEventListener('change',function(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(){
var txt=String(r.result||'').replace(/^\uFEFF/,'').trim(),mb=(f.size/1048576).toFixed(1)+'MB',o=null,why='';
if(!txt)why='파일이 비어 있어요 ('+mb+'). iCloud에서 아직 내려받지 못한 파일일 수 있어요. 파일 앱에서 그 파일을 한 번 눌러 내려받은 뒤 다시 골라보세요.';
else{try{o=JSON.parse(txt)}catch(err){why=(txt.charAt(txt.length-1)!=='}')?'파일이 중간에서 끊긴 것 같아요 ('+mb+'). 옮기는 도중에 잘렸을 수 있어요. AirDrop이나 파일 앱으로 다시 옮겨보세요.':'파일 내용이 깨져 있어요 ('+mb+').'}}
if(o&&!why){
if(o.app==='studyapp'&&o.st&&typeof o.st==='object'){bkPend=o.st;bkPackPend=(o.pack&&typeof o.pack==='object')?o.pack:null;bkMsg=''}
else if(Array.isArray(o.lectures)||Array.isArray(o.subjects))why='이건 \u201c자료 파일\u201d이에요. 과목 탭의 \u201c자료 불러오기\u201d로 불러오세요.';
else why='이 앱에서 내보낸 백업 파일이 아니에요. 파일 이름이 study_backup_…으로 시작하는지 확인해주세요.';
}
if(why){bkPend=null;bkPackPend=null;bkMsg=why}
renderHome();
};
r.onerror=function(){bkMsg='파일을 열지 못했어요. 파일이 너무 크거나 아직 내려받지 못했을 수 있어요.';renderHome()};
r.onloadend=function(){e.target.value=''};
r.readAsText(f);
});
boot();
})();
</script>

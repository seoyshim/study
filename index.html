<script>
var PDFPROC=(function(){
function stripSubset(n){return String(n||'').replace(/^[A-Z]{6}\+/,'')}
function hlPix(r,g,b){
var mx=Math.max(r,g,b),mn=Math.min(r,g,b);
return mn>=100&&mx>=230&&(mx-mn)>=70;
}
function hlColor(r,g,b){
if(r<g-40&&r<b-40)return 'cyan';
if(b<r-40&&b<g-40)return 'yellow';
if(g<r-40&&g<b-40)return 'pink';
if(r<b-40&&b>=r&&g>=r)return 'cyan';
if(r<g-40&&b<g-40)return 'green';
return 'other';
}
function splitWords(str){
var out=[],re=/\S+/g,m;
while((m=re.exec(str)))out.push({s:m[0],i:m.index,e:m.index+m[0].length});
return out;
}
async function pageWords(page,vp){
var tc=await page.getTextContent();
await page.getOperatorList();
var fonts={},items=[];
tc.items.forEach(function(it){
if(!it.str||!it.str.trim())return;
if(!(it.fontName in fonts)){
var nm='';
try{var f=page.commonObjs.get(it.fontName);nm=stripSubset(f&&(f.name||f.loadedName))}catch(e){}
fonts[it.fontName]=nm;
}
if(fonts[it.fontName].charAt(0)==='.')return;
var tx=it.transform,h=Math.abs(it.height)||Math.hypot(tx[2],tx[3])||10,x=tx[4],y=tx[5],w=it.width||(it.str.length*h*0.5);
var top=vp.height-(y+h*0.85),bottom=vp.height-(y-h*0.2);
var words=splitWords(it.str),n=Math.max(it.str.length,1);
items.push({str:it.str,left:x,right:x+w,top:top,bottom:bottom,words:words.map(function(wd){return {s:wd.s,left:x+w*wd.i/n,right:x+w*wd.e/n,top:top,bottom:bottom,hl:false,col:''}})});
});
return items;
}
function markHighlights(items,img,scale){
var W=img.width,H=img.height,d=img.data,total=0,hit=0,step=7;
for(var i=0;i<W*H;i+=step){total++;var o=i*4;if(hlPix(d[o],d[o+1],d[o+2]))hit++}
if(total&&hit/total>0.25)return 0;
var n=0;
items.forEach(function(it){
it.words.forEach(function(w){
var x0=Math.max(0,Math.floor(w.left*scale)),x1=Math.min(W,Math.ceil(w.right*scale)),y0=Math.max(0,Math.floor(w.top*scale)),y1=Math.min(H,Math.ceil(w.bottom*scale));
if(x1<=x0||y1<=y0)return;
var cnt=0,rowsOK=0,cr=0,cg=0,cb=0,wd=x1-x0;
for(var y=y0;y<y1;y++){
var rc=0;
for(var x=x0;x<x1;x++){
var o=(y*W+x)*4,r=d[o],g=d[o+1],b=d[o+2];
if(hlPix(r,g,b)){rc++;cr+=r;cg+=g;cb+=b}
}
cnt+=rc;
if(rc/wd>=0.35)rowsOK++;
}
if(cnt&&rowsOK>=Math.max(2,0.1*(y1-y0))){w.hl=true;w.col=hlColor(cr/cnt,cg/cnt,cb/cnt);n++}
});
});
return n;
}
function buildLines(items){
var its=items.slice().sort(function(a,b){return (a.top-b.top)||(a.left-b.left)});
var lines=[];
its.forEach(function(it){
var h=it.bottom-it.top,cur=lines[lines.length-1];
if(cur&&Math.abs(it.top-cur.top)<h*0.5)cur.items.push(it);
else lines.push({top:it.top,items:[it]});
});
return lines.map(function(l){
l.items.sort(function(a,b){return a.left-b.left});
var ws=[];l.items.forEach(function(it){it.words.forEach(function(w){ws.push(w)})});
var txt='',open=false;
ws.forEach(function(w,i){
if(w.hl&&!open){txt+=(i?' ':'')+'\u27e6'+w.s;open=true}
else if(!w.hl&&open){txt+='\u27e7 '+w.s;open=false}
else txt+=(i?' ':'')+w.s;
});
if(open)txt+='\u27e7';
return {text:txt,words:ws};
});
}
function drawImageObj(obj,env){
var w=obj.width,h=obj.height,c=env.makeCanvas(w,h),ctx=c.getContext('2d');
if(obj.bitmap){ctx.drawImage(obj.bitmap,0,0);return c}
var d=obj.data;
if(!d)return null;
var img=ctx.createImageData(w,h),o=img.data;
if(d.length===w*h*4)o.set(d);
else if(d.length===w*h*3){for(var i=0,j=0;i<w*h;i++){o[j++]=d[i*3];o[j++]=d[i*3+1];o[j++]=d[i*3+2];o[j++]=255}}
else return null;
ctx.putImageData(img,0,0);
return c;
}
function toSmallJpeg(src,env){
var w=src.width,h=src.height,m=Math.max(w,h),k=m>640?640/m:1,w2=Math.round(w*k),h2=Math.round(h*k);
var c=env.makeCanvas(w2,h2),ctx=c.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,w2,h2);
ctx.drawImage(src,0,0,w2,h2);
return env.toJpeg(c);
}
function getObj(page,id){
var store=String(id).indexOf('g_')===0?page.commonObjs:page.objs;
return new Promise(function(res){
var done=false;
var t=setTimeout(function(){if(!done){done=true;res(null)}},4000);
try{store.get(id,function(o){if(!done){done=true;clearTimeout(t);res(o)}})}catch(e){if(!done){done=true;clearTimeout(t);res(null)}}
});
}
async function pageImages(pdfjsLib,page,env,seen){
var ops=await page.getOperatorList(),out=[];
for(var i=0;i<ops.fnArray.length;i++){
var fn=ops.fnArray[i];
if(fn!==pdfjsLib.OPS.paintImageXObject&&fn!==pdfjsLib.OPS.paintJpegXObject)continue;
var id=ops.argsArray[i][0];
if(seen[id])continue;
seen[id]=1;
var obj=await getObj(page,id);
if(!obj||!obj.width||!obj.height)continue;
if(obj.width<150||obj.height<150)continue;
try{
var c=drawImageObj(obj,env);
if(!c)continue;
out.push({w:obj.width,h:obj.height,uri:toSmallJpeg(c,env)});
}catch(e){}
}
return out;
}
async function extractPdf(pdfjsLib,data,env,onProgress,opts){
opts=opts||{};
var scale=opts.scale||1.5;
var pdf=await pdfjsLib.getDocument({data:data,disableFontFace:true}).promise;
var pages=[],images=[],seen={};
for(var n=1;n<=pdf.numPages;n++){
if(onProgress)onProgress(n,pdf.numPages);
var page=await pdf.getPage(n);
var vp=page.getViewport({scale:1}),vps=page.getViewport({scale:scale});
var items=await pageWords(page,vp);
var hlN=0;
if(items.length){
var c=env.makeCanvas(Math.ceil(vps.width),Math.ceil(vps.height)),ctx=c.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
await page.render({canvasContext:ctx,viewport:vps}).promise;
var img=ctx.getImageData(0,0,c.width,c.height);
hlN=markHighlights(items,img,scale);
c.width=1;c.height=1;
}
var lines=buildLines(items);
var pimgs=opts.noImages?[]:await pageImages(pdfjsLib,page,env,seen);
var idx=[];
pimgs.forEach(function(im){images.push(im.uri);idx.push(images.length-1)});
pages.push({n:n,text:lines.map(function(l){return l.text}).join('\n'),hl:hlN,imgs:idx});
if(page.cleanup)page.cleanup();
}
return {pages:pages,images:images};
}
return {extractPdf:extractPdf,stripSubset:stripSubset,hlPix:hlPix};
})();

</script>

function shareDeck(d){
var bin=atob(d.b64),u=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
var file=new File([u],d.file,{type:'application/zip'});
if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:d.name});
var url=URL.createObjectURL(file),a=document.createElement('a');
a.href=url;a.download=d.file;document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(url)},4000);
return Promise.resolve();
}

var gIdx={},gKo={};
function gnorm(s){return String(s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/\s+/g,' ').trim()}
function buildIndex(){
gIdx={};gKo={};
(D.glossary||[]).forEach(function(g){
[g.t].concat(g.a||[]).forEach(function(a){var k=gnorm(a);if(k&&!gIdx[k])gIdx[k]=g});
var kk=String(g.k||'').split(/[(\uff08]/)[0].trim();
if(kk.length>=2&&!gKo[kk])gKo[kk]=g;
});
}
function lookupTerm(k){
var u=st.terms&&st.terms[k];
if(u)return {t:k,k:u.k||'',d:u.d,mine:true,ai:!!u.ai};
if(gIdx[k])return gIdx[k];
var alt=[];
if(/ies$/.test(k))alt.push(k.slice(0,-3)+'y');
if(/es$/.test(k))alt.push(k.slice(0,-2));
if(/s$/.test(k))alt.push(k.slice(0,-1));
for(var i=0;i<alt.length;i++){
if(gIdx[alt[i]])return gIdx[alt[i]];
var u2=st.terms&&st.terms[alt[i]];
if(u2)return {t:alt[i],k:u2.k||'',d:u2.d,mine:true,ai:!!u2.ai};
}
return null;
}
function findTerms(text){
var words=(text.match(/[A-Za-z\u03b1\u03b2][A-Za-z0-9\u03b2\-']*/g)||[]).map(function(w){return w.replace(/^[-']+|[-']+$/g,'')}).filter(Boolean);
var out=[],seen={},i=0;
while(i<words.length){
var hit=null,n=0;
for(var len=Math.min(4,words.length-i);len>=1;len--){
var h=lookupTerm(gnorm(words.slice(i,i+len).join(' ')));
if(h){hit=h;n=len;break}
}
if(hit){var key=gnorm(hit.t);if(!seen[key]){seen[key]=1;out.push(hit)}i+=n}else i++;
}
(text.match(/[\uac00-\ud7a3]{2,}/g)||[]).forEach(function(tok){
for(var len=tok.length;len>=2;len--){
var g=gKo[tok.slice(0,len)];
if(g){var key=gnorm(g.t);if(!seen[key]){seen[key]=1;out.push(g)}break}
}
});
return out;
}
function termKey(text){return gnorm(text.replace(/[^A-Za-z0-9\u03b1\u03b2\-' ]+/g,' '))||text.trim()}

var d=x.getImageData(0,0,9,8).data,bits='';
function g(i){return d[i*4]*0.3+d[i*4+1]*0.59+d[i*4+2]*0.11}
for(var y=0;y<8;y++)for(var xx=0;xx<8;xx++)bits+=g(y*9+xx)>g(y*9+xx+1)?'1':'0';

};

im.src=uri;
});
}

function linkQuestions(subject,onProg){
var qs=unlinkedQs(subject);
if(!qs.length||!lecsOf(subject).length)return Promise.resolve({n:0,linked:0,under:0});
var idx=buildIdx(subject),items={};
D.lectures.forEach(function(l){l.sections.forEach(function(sec){sec.items.forEach(function(it){items[it.id]={it:it,sec:sec,lec:l}})})});
var pq=qs.map(function(q){
var o={id:q.id,type:q.type==='mcq'?'mcq':'short',q:q.q,o:q.o||[],ans:'',cands:[]};
var c=candOf(idx,o);
o.cands=c.map(function(x){return {id:x.s.id,lec:x.s.lec,t:x.s.t.slice(0,160)}});
o.score=c.length?c[0].v:0;
return o;
});
var need=pq.filter(function(o){return o.score>=MINSC}).map(function(o){return o.id}),batches=[];
for(var i=0;i<need.length;i+=6)batches.push(need.slice(i,i+6));
var fake={qs:pq},res={},bi=0;
function step(){
if(bi>=batches.length)return Promise.resolve();
if(onProg)onProg(bi,batches.length);
return aiJson(matchPrompt(fake,batches[bi]),MSYS).then(function(j){((j&&j.results)||[]).forEach(function(r){if(r&&r.id)res[r.id]=r});bi++}).then(step);
}
return step().then(function(){
var linked=0,underl={},pjobs=[];
qs.forEach(function(q){
var r=res[q.id]||{},lecId='';
var sup=(Array.isArray(r.support)?r.support:[]).filter(function(id){return items[id]});
if(sup.length)lecId=items[sup[0]].lec.id;
else if(r.lec&&D.lectures.some(function(l){return l.id===r.lec}))lecId=r.lec;
if(!lecId)return;
q.lec=lecId;linked++;
sup.forEach(function(id){var m=items[id];if(m.lec.id===lecId){m.it.j=m.it.j||[];if(m.it.j.indexOf(q.examId)<0)m.it.j.push(q.examId);underl[id]=1}});
if(q.type==='mcq'&&q.a<0&&Number.isInteger(r.a)&&r.a>=0&&r.a<(q.o||[]).length){q.a=r.a;q.e='정답은 AI가 강의 내용으로 추정한 거예요.'}
if(q.type==='short'&&/근거가 없어요/.test(q.e||'')&&typeof r.answer==='string'&&r.answer.trim())q.e=r.answer.trim();
if(q.img){var lec=D.lectures.filter(function(l){return l.id===lecId})[0],sec=sup.length&&items[sup[0]]?items[sup[0]].sec:lec.sections[0];if(lec&&(sec||lec.sections[0]))pjobs.push({img:q.img,lec:lec,sec:sec||lec.sections[0],eid:q.examId})}
});
var chain=Promise.resolve();
pjobs.forEach(function(p2){chain=chain.then(function(){return addExamPhoto(p2,p2.eid)})});
return chain.then(function(){
save();
return idbSet('pack',D).catch(function(){});
}).then(function(){return {n:qs.length,linked:linked,under:Object.keys(underl).length}});
});
}

function lectureFromJob(job){
var secs=[],idx={};
job.results.forEach(function(r){
r.sections.forEach(function(s){
var key=gnorm(s.h),si=idx[key];
if(si===undefined){si=secs.length;idx[key]=si;secs.push({h:s.h,items:[],photos:[]})}
s.items.forEach(function(it){secs[si].items.push({id:job.lid+'-'+si+'-'+secs[si].items.length,t:it.t,src:it.src||''})});
});
});
var pageSec={};
secs.forEach(function(sec,si){sec.items.forEach(function(it){var n=parseInt(it.src,10);if(n&&!(n in pageSec))pageSec[n]=si})});
var pnums=Object.keys(pageSec).map(Number);
job.pages.forEach(function(pg){
if(!pg.imgs.length||!secs.length)return;
var si=pageSec[pg.n];
if(si===undefined){
var best=null;
pnums.forEach(function(q){if(best===null||Math.abs(q-pg.n)<Math.abs(best-pg.n))best=q});
si=best===null?0:pageSec[best];
}
pg.imgs.forEach(function(ix){secs[si].photos.push({img:job.images[ix],ans:'사진',feat:[],src:String(pg.n),_p:pg.n})});
});
secs.forEach(function(sec){sec.photos.sort(function(a,b){return a._p-b._p});sec.photos.forEach(function(p){delete p._p})});
return {id:job.lid,subject:job.subject,title:job.name,prof:job.prof||'',sections:secs};
}
function finishJob(){
var job=pj,lec=lectureFromJob(job);
D.lectures=mergeBy(D.lectures,[lec]);
var qs=[];
job.results.forEach(function(r){r.questions.forEach(function(q){qs.push({id:job.lid+'-q'+(qs.length+1),lec:job.lid,subject:job.subject,q:q.q,o:q.o,a:q.a,e:q.e+(q.src?' (슬라이드 '+q.src+')':''),src:'gen'})})});
var cs=[];
job.results.forEach(function(r){(r.cloze||[]).forEach(function(c){cs.push({id:job.lid+'-c'+(cs.length+1),lec:job.lid,subject:job.subject,type:'cloze',q:c.t,e:c.src?'슬라이드 '+c.src:'',src:'gen'})})});
D.questions=mergeBy(D.questions,qs.concat(cs));
var have={};
(D.glossary||[]).forEach(function(g){have[gnorm(g.t)]=1;(g.a||[]).forEach(function(a){have[gnorm(a)]=1})});
var ng=[];
job.results.forEach(function(r){r.glossary.forEach(function(g){var k=gnorm(g.t);if(!k||have[k])return;have[k]=1;ng.push({id:k,t:g.t,k:g.k,d:g.d,a:g.a,ai:true})})});
D.glossary=mergeBy(D.glossary||[],ng);
buildIndex();
if(subs().indexOf(job.subject)<0)st.extra=(st.extra||[]).concat([job.subject]);
if(job.week)st.lw[job.lid]=job.week;
st.lec[job.subject]=job.lid;
var ns=0;lec.sections.forEach(function(s){ns+=s.items.length});
pdone={lid:job.lid,subject:job.subject,title:job.name,sentences:ns,questions:qs.length,cloze:cs.length,terms:ng.length,photos:lec.sections.reduce(function(a,s){return a+s.photos.length},0)};
pj=null;procOpen=true;pmsg='';pfile=null;
save();
return idbSet('pack',D).then(function(){return idbSet('job',null)}).catch(function(){pmsg='정리는 끝났지만 이 기기에 저장하지 못했어요. 앱을 닫으면 사라질 수 있어요.'});
}

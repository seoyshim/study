<style>
:root{--bg:#ffffff;--s1:#f4f3ee;--tx:#1f1f1d;--tx2:#5f5e5a;--tx3:#8a8983;--bd:rgba(0,0,0,.13);--bd2:rgba(0,0,0,.28);--acc:#185FA5;--accbg:#E6F1FB;--accbd:#85B7EB;--ok:#3B6D11;--okbg:#EAF3DE;--okbd:#97C459;--no:#A32D2D;--nobg:#FCEBEB;--nobd:#F09595;--wn:#854F0B;--wnbg:#FAEEDA;--wnbd:#EF9F27;--pur:#7F77DD;--hl:rgba(250,199,117,.6);--tbbg:#2c2c2a;--tbtx:#f1efe8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--s1:#2a2a27;--tx:#f1efe8;--tx2:#b4b2a9;--tx3:#888780;--bd:rgba(255,255,255,.14);--bd2:rgba(255,255,255,.3);--acc:#85B7EB;--accbg:#0C447C;--accbd:#378ADD;--ok:#97C459;--okbg:#27500A;--okbd:#639922;--no:#F09595;--nobg:#501313;--nobd:#A32D2D;--wn:#FAC775;--wnbg:#412402;--wnbd:#BA7517;--hl:rgba(239,159,39,.38);--tbbg:#f1efe8;--tbtx:#1f1f1d}}
:root[data-theme="dark"]{--bg:#1c1c1a;--s1:#2a2a27;--tx:#f1efe8;--tx2:#b4b2a9;--tx3:#888780;--bd:rgba(255,255,255,.14);--bd2:rgba(255,255,255,.3);--acc:#85B7EB;--accbg:#0C447C;--accbd:#378ADD;--ok:#97C459;--okbg:#27500A;--okbd:#639922;--no:#F09595;--nobg:#501313;--nobd:#A32D2D;--wn:#FAC775;--wnbg:#412402;--wnbd:#BA7517;--hl:rgba(239,159,39,.38);--tbbg:#f1efe8;--tbtx:#1f1f1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
#ttl{font-size:17px;font-weight:500}
.ver{font-size:11px;color:var(--tx3)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 18px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:.5px solid var(--bd);background:var(--bg)}
nav button{flex:1;background:none;border:none;padding:8px 0 10px;font:inherit;font-size:12px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button.on{color:var(--acc)}
button{font:inherit;color:var(--tx);cursor:pointer}
.btn{background:none;border:.5px solid var(--bd2);border-radius:8px;padding:8px 12px;font-size:14px}
.btn.pri{background:var(--accbg);border-color:var(--accbd);color:var(--acc)}
.btn.full{width:100%}
input[type=text],select{font:inherit;font-size:14px;color:var(--tx);background:var(--bg);border:.5px solid var(--bd2);border-radius:8px;padding:8px 10px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:.5px solid var(--bd2);border-radius:8px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accbg);border-color:var(--accbd);color:var(--acc)}
.lbl{font-size:12px;color:var(--tx2);margin:16px 0 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:.5px solid var(--bd);font-size:14px}
.err{font-size:13px;color:var(--no);min-height:18px}
.note{font-size:13px;color:var(--tx2);line-height:1.6}
.met{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0}
.met div{background:var(--s1);border-radius:8px;padding:10px}
.met small{display:block;font-size:12px;color:var(--tx2)}
.met b{font-size:20px;font-weight:500}
.cell{height:44px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;border-radius:8px;border:.5px dashed var(--bd2);background:none;color:var(--tx2)}
.cell.d{background:var(--accbg);border:.5px solid var(--accbd);color:var(--acc)}
.cell.on{box-shadow:0 0 0 2px var(--accbd)}
.yl{font-size:13px;color:var(--tx2)}
.hd{font-size:12px;color:var(--tx2);text-align:center}
.pn{border:.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0 0}
#nb{position:relative}
#tb{display:none;position:absolute;z-index:5;background:var(--tbbg);border-radius:10px;padding:4px;white-space:normal;max-width:100%}
#tb button{background:none;border:none;color:var(--tbtx);font-size:13px;padding:7px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}
#tb input{width:150px;height:32px}
.sn{margin:0 0 6px}
.txt{margin:0;font-size:15px;line-height:1.85;-webkit-touch-callout:none}
.src{font-size:11px;color:var(--tx3)}
.xn{font-size:12px;color:var(--wn);margin:0 0 2px}
.hl{background:var(--hl)}
.st{font-weight:700}
.mm{color:var(--acc)}
.sel{background:var(--accbg);box-shadow:0 0 0 1px var(--accbd)}
.jb{text-decoration:underline;text-decoration-color:var(--pur);text-decoration-thickness:2px;text-underline-offset:3px}
.mi{background:none;border:none;padding:0 3px;color:var(--acc);vertical-align:-3px}
.mn{font-size:13px;line-height:1.6;background:var(--accbg);color:var(--acc);border-radius:8px;padding:8px 10px;margin:2px 0 6px;display:none;justify-content:space-between;gap:8px}
.mn.o{display:flex}
.dc{border:.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin:4px 0 10px;background:var(--s1)}
.dc b{font-weight:500}
.dc .ko{color:var(--acc);font-size:13px;margin-left:6px}
.dc p{margin:2px 0 0;font-size:14px;line-height:1.6}
h3{font-size:16px;font-weight:500;margin:18px 0 4px}
.ph{margin:8px 0 12px}
.ph img{width:100%;max-height:200px;object-fit:contain;background:var(--s1);border-radius:8px;display:block;cursor:pointer}
.ph.big img{max-height:none}
.cap{font-size:13px;line-height:1.6;margin-top:4px}
.cap ul{margin:2px 0 0 18px;padding:0;color:var(--tx2)}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;font-size:15px;padding:11px 12px;line-height:1.45;background:none;border:.5px solid var(--bd2);border-radius:8px}
.opt.ok{background:var(--okbg);border-color:var(--okbd)}
.opt.no{background:var(--nobg);border-color:var(--nobd)}
.rate{flex:1;font-size:13px;padding:9px 4px;line-height:1.35;background:none;border:.5px solid var(--bd2);border-radius:8px}
.bar{height:4px;background:var(--s1);border-radius:2px;margin:0 0 14px}
.bar i{display:block;height:4px;background:var(--acc);border-radius:2px}
.ic{vertical-align:-3px}
.deck{border:.5px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 8px}
.pc{border:.5px solid var(--bd);border-radius:12px;padding:10px;margin:0 0 8px}
.pc img{width:100%;max-height:220px;object-fit:contain;background:var(--s1);border-radius:8px;display:block;margin:0 0 8px}
</style>
</head>
<body>
<div id="app">
<header><span id="ttl"></span><span class="ver">v0.8</span></header>
<main id="main">
<section id="p0"></section>
<section id="p1"></section>
<section id="p2"></section>
<section id="p3"></section>
</main>
<nav id="nav"></nav>
</div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<input type="file" id="fb" accept=".txt,.json,text/plain,application/json" hidden>
<script>
(function(){
'use strict';
var D={subjects:[],lectures:[],questions:[],pending:[],decks:[],glossary:[]};
var I={
check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',plus:'<path d="M5 12h14M12 5v14"/>',
clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
star:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
up:'<path d="m18 15-6-6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',

pen:'<path d="m9 11-6 6v3h9l3-3M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>',
eraser:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21M22 21H7M5 11l9 9"/>',
book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',

repeat:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 21v-5h5"/>',
layers:'<path d="m12 2 10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>'
};
function ic(n,s,c){return '<svg class="ic'+(c?' '+c:'')+'" viewBox="0 0 24 24" width="'+(s||18)+'" height="'+(s||18)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[n]+'</svg>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}


function idb(){return new Promise(function(res,rej){try{var q=indexedDB.open('studyapp',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv')};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}}catch(e){rej(e)}})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})})}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error)}})})}
function mergeBy(a,b){var m={},o=[];a.concat(b).forEach(function(x){if(!(x.id in m))o.push(x.id);m[x.id]=x});return o.map(function(k){return m[k]})}
function norm(p){return {subjects:p.subjects||[],lectures:p.lectures||[],questions:p.questions||[],pending:p.pending||[],decks:p.decks||[],glossary:p.glossary||[]}}
function merge(a,b){var s=a.subjects.slice();(b.subjects||[]).forEach(function(x){if(s.indexOf(x)<0)s.push(x)});return {subjects:s,lectures:mergeBy(a.lectures,b.lectures||[]),questions:mergeBy(a.questions,b.questions||[]),pending:mergeBy(a.pending,b.pending||[]),decks:mergeBy(a.decks,b.decks||[]),glossary:mergeBy(a.glossary||[],b.glossary||[])}}
var impMsg='';
function afterImport(){renderHome();show(tab)}
$('fi').addEventListener('change',function(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(){
var p;
try{p=JSON.parse(r.result);if(!p||!Array.isArray(p.lectures))throw new Error('bad')}catch(err){impMsg='자료 파일을 읽지 못했어요. 올바른 자료 파일인지 확인해주세요.';afterImport();return}
D=merge(D,p);buildIndex();
var n='강의 '+(p.lectures||[]).length+'개, 문제 '+(p.questions||[]).length+'개를 불러왔어요.';
idbSet('pack',D).then(function(){impMsg=n;afterImport()}).catch(function(){impMsg=n+' 다만 이 기기에 저장하지 못해서 앱을 닫으면 사라질 수 있어요.';afterImport()});
};
r.onerror=function(){impMsg='파일을 열지 못했어요.';afterImport()};
r.readAsText(f);
e.target.value='';
});
function shareDeck(d){
var bin=atob(d.b64),u=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
var file=new File([u],d.file,{type:'application/zip'});
if(navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:d.name});
var url=URL.createObjectURL(file),a=document.createElement('a');
a.href=url;a.download=d.file;document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(url)},4000);
return Promise.resolve();
}
function boot(){
idbGet('pack').then(function(p){if(p){D=norm(p);buildIndex()}}).catch(function(){}).then(function(){
migrate();renderHome();show(0);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){});
});
}

var KEY='studyapp.v1';
var st={ts:0,extra:[],cur:0,marks:{},srs:{},asg:{},pend:{},lec:{},lw:{},names:{},qlec:{},qscope:'all',terms:{},miss:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in o)st[k]=o[k]}}catch(e){}
var dbDoc=null,saveT=null;
function save(){
st.ts=Date.now();
try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
clearTimeout(saveT);
saveT=setTimeout(function(){if(dbDoc){dbDoc.set(st).catch(function(){})}},800);
}

function subs(){return D.subjects.concat(st.extra||[])}
function curSub(){var a=subs();if(st.cur>=a.length)st.cur=0;return a[st.cur]||''}
function lecsOf(s){return D.lectures.filter(function(l){return l.subject===s})}
function lecById(id){return D.lectures.filter(function(l){return l.id===id})[0]}
function asgOf(s){if(!st.asg[s])st.asg[s]={w:{},e:{}};return st.asg[s]}
function migrate(){
st.lw=st.lw||{};st.names=st.names||{};st.qlec=st.qlec||{};
for(var s in (st.asg||{})){var w=st.asg[s].w||{};for(var k in w){if(!st.lw[w[k]])st.lw[w[k]]=+k}st.asg[s].w={}}
}
function lname(l){var n=st.names[l.id];return (n&&n.t)||l.title}
function lprof(l){var n=st.names[l.id];return n&&n.p!==undefined?n.p:(l.prof||'')}
function ldisp(l){var p=lprof(l);return lname(l)+(p?' · '+p:'')}
function wkOf(l){return st.lw[l.id]||0}
function qLec(q){return st.qlec[q.id]!==undefined?st.qlec[q.id]:q.lec}
function qWeek(q){var l=lecById(qLec(q));return l?wkOf(l):-1}
function lsort(a,b){var x=wkOf(a)||99,y=wkOf(b)||99;return x-y||lname(a).localeCompare(lname(b),'ko')}
function wlabel(w){return w?w+'주차':'주차 미지정'}


var tab=0,slot=null,hint=false,pend=null,allOpen=false,openMn={},curLecId=null;
var NAMES=['과목','정리본','복습','카드'];
var NAVI=['books','book','repeat','layers'];

function renderNav(){
$('nav').innerHTML=NAMES.map(function(n,i){return '<button data-t="'+i+'" class="'+(i===tab?'on':'')+'">'+ic(NAVI[i],22)+n+'</button>'}).join('');
}
function show(n){
tab=n;pend=null;hideTb();
for(var i=0;i<4;i++){$('p'+i).style.display=i===n?'block':'none'}
$('ttl').textContent=n===0?'과목':curSub()+' · '+NAMES[n];
renderNav();
if(n===1)renderNotes();
if(n===2)startQuiz(false);
if(n===3)renderCards();
$('main').scrollTop=0;
}
function renderAll(){renderHome();if(tab===1)renderNotes();if(tab===2)startQuiz(false);if(tab===3)renderCards();show(tab)}

var ren=null;
function renderHome(){
var h='';
if(impMsg)h+='<div class="note" style="margin:6px 0 8px;color:var(--acc)">'+esc(impMsg)+'</div>';
if(!D.lectures.length){h+='<div class="pn" style="margin:12px 0 4px"><b style="font-weight:500">자료가 아직 없어요</b><div class="note" style="margin:4px 0 10px">Claude에서 받은 자료 파일(.json)을 불러오면 정리본, 문제, 카드가 채워져요.</div><button class="btn pri full" id="imp">'+ic('upload',16)+' 자료 불러오기</button></div>'}
var s=curSub(),lecs=lecsOf(s).sort(lsort),a=asgOf(s),ws={};
lecs.forEach(function(l){if(wkOf(l))ws[wkOf(l)]=1});
h+='<div class="chips">'+subs().map(function(x,i){return '<button class="chip'+(i===st.cur?' on':'')+'" data-s="'+i+'">'+esc(x)+'</button>'}).join('')+'</div>';
h+='<div style="display:flex;gap:6px;margin:8px 0 0"><input id="sn" type="text" placeholder="새 과목 이름" style="flex:1"><button class="btn" id="sa">과목 추가</button></div><div class="err" id="se"></div>';
h+='<div class="met"><div><small>강의록 주차</small><b>'+Object.keys(ws).length+' / 15</b></div><div><small>족보 연결</small><b>'+Object.keys(a.e).length+' / 13</b></div></div>';
h+='<div class="lbl">정리된 강의</div>';
if(!lecs.length)h+='<div class="note">아직 정리된 강의가 없어요.</div>';
lecs.forEach(function(l){
if(ren===l.id){
h+='<div class="pn" style="margin:6px 0"><div class="note" style="margin:0 0 4px">이름</div><input id="rn" type="text" value="'+esc(lname(l))+'" style="width:100%;margin:0 0 6px"><div class="note" style="margin:0 0 4px">교수님</div><input id="rp" type="text" value="'+esc(lprof(l))+'" placeholder="예: 홍길동" style="width:100%"><div class="err" id="re"></div><div style="display:flex;gap:6px"><button class="btn pri" data-rsave="'+l.id+'">저장</button><button class="btn" data-rcancel="1">취소</button></div></div>';
return;
}
h+='<div class="row"><span style="min-width:0">'+esc(lname(l))+(lprof(l)?' <span class="src">'+esc(lprof(l))+'</span>':'')+' <span class="src">'+wlabel(wkOf(l))+'</span></span><span style="display:flex;gap:6px"><button class="btn" data-ren="'+l.id+'" aria-label="이름 변경">'+ic('pen',15)+'</button><button class="btn pri" data-open="'+l.id+'">정리본</button></span></div>';
});
h+='<div class="lbl">강의록 · 주차별</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">';
for(var i=1;i<=15;i++)h+=cell('w',i,i+'주');
h+='</div>';

var gIdx={},gKo={};
function gnorm(s){return String(s).toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/\s+/g,' ').trim()}
function buildIndex(){
gIdx={};gKo={};
(D.glossary||[]).forEach(function(g){
[g.t].concat(g.a||[]).forEach(function(a){var k=gnorm(a);if(k&&!gIdx[k])gIdx[k]=g});
var kk=String(g.k||'').split(/[(\uff08]/)[0].trim();
if(kk.length>=2&&!gKo[kk])gKo[kk]=g;
});
}
function lookupTerm(k){
var u=st.terms&&st.terms[k];
if(u)return {t:k,k:u.k||'',d:u.d,mine:true,ai:!!u.ai};
if(gIdx[k])return gIdx[k];
var alt=[];
if(/ies$/.test(k))alt.push(k.slice(0,-3)+'y');
if(/es$/.test(k))alt.push(k.slice(0,-2));
if(/s$/.test(k))alt.push(k.slice(0,-1));
for(var i=0;i<alt.length;i++){
if(gIdx[alt[i]])return gIdx[alt[i]];
var u2=st.terms&&st.terms[alt[i]];
if(u2)return {t:alt[i],k:u2.k||'',d:u2.d,mine:true,ai:!!u2.ai};
}
return null;
}
function findTerms(text){
var words=(text.match(/[A-Za-z\u03b1\u03b2][A-Za-z0-9\u03b2\-']*/g)||[]).map(function(w){return w.replace(/^[-']+|[-']+$/g,'')}).filter(Boolean);
var out=[],seen={},i=0;
while(i<words.length){
var hit=null,n=0;
for(var len=Math.min(4,words.length-i);len>=1;len--){
var h=lookupTerm(gnorm(words.slice(i,i+len).join(' ')));
if(h){hit=h;n=len;break}
}
if(hit){var key=gnorm(hit.t);if(!seen[key]){seen[key]=1;out.push(hit)}i+=n}else i++;
}
(text.match(/[\uac00-\ud7a3]{2,}/g)||[]).forEach(function(tok){
for(var len=tok.length;len>=2;len--){
var g=gKo[tok.slice(0,len)];
if(g){var key=gnorm(g.t);if(!seen[key]){seen[key]=1;out.push(g)}break}
}
});
return out;
}
function termKey(text){return gnorm(text.replace(/[^A-Za-z0-9\u03b1\u03b2\-' ]+/g,' '))||text.trim()}

h+='<div class="pc"><img src="'+p.img+'" alt="'+esc(p.title)+'"><div style="font-weight:500;font-size:14px">'+esc(p.title)+'</div><div class="note" style="margin:0 0 8px">'+esc(p.hint)+'</div><div style="display:flex;gap:6px"><input type="text" class="pa" data-id="'+p.id+'" value="'+esc(v)+'" placeholder="소견 입력" style="flex:1"><button class="btn" data-ps="'+p.id+'">저장</button></div><div class="err" id="pe-'+p.id+'"></div></div>';
});
h+='<button class="btn full" id="cp">'+ic('copy',16)+' 입력한 소견 복사</button><div class="note" id="cm" style="margin-top:6px"></div>';
var ms=st.miss||[];
h+='<div class="lbl">\uc6a9\uc5b4 \ucd94\uac00 \uc694\uccad '+ms.length+'</div>';
if(ms.length){h+='<div class="note" style="margin:0 0 8px">'+ms.map(esc).join(', ')+'</div><div style="display:flex;gap:6px"><button class="btn" id="cpm" style="flex:1">'+ic('copy',16)+' \ubcf5\uc0ac</button><button class="btn" id="clm">\ube44\uc6b0\uae30</button></div><div class="note" id="cmm" style="margin-top:6px"></div>'}
else h+='<div class="note">\uc815\ub9ac\ubcf8\uc5d0\uc11c \uc6a9\uc5b4\ub97c \ucc3e\uc558\ub294\ub370 \uc5c6\uc744 \ub54c \uc694\uccad \ubaa9\ub85d\uc5d0 \ub2f4\uc744 \uc218 \uc788\uc5b4\uc694.</div>';
h+='<div class="note" style="margin-top:14px">사진 가리기 카드는 다음 버전에서 만들어요.</div>';
$('p3').innerHTML=h;
}
$('p3').addEventListener('click',function(e){
var t=e.target.closest('button');if(!t)return;
if(t.dataset.dl){
var d=D.decks.filter(function(x){return x.id===t.dataset.dl})[0];
if(!d)return;
shareDeck(d).then(function(){msg='';$('dm').textContent=''}).catch(function(er){if(er&&er.name==='AbortError')return;msg='내려받기에 실패했어요. 다시 시도해주세요.';var m=$('dm');if(m)m.textContent=msg});
return;
}
if(t.id==='cpm'){
var mt=(st.miss||[]).join('\n');
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(mt).then(function(){$('cmm').textContent='\ubcf5\uc0ac\ud588\uc5b4\uc694. \ucc44\ud305\uc5d0 \ubd99\uc5ec\ub123\uc5b4 \ubcf4\ub0b4\uc8fc\uc138\uc694.'}).catch(function(){$('cmm').textContent=mt})}
else $('cmm').textContent=mt;
return;
}
if(t.id==='clm'){st.miss=[];save();renderCards();return}
if(t.dataset.ps){
var id=t.dataset.ps,v=document.querySelector('.pa[data-id="'+id+'"]').value.trim();
if(!v){$('pe-'+id).textContent='소견을 입력하세요';return}
st.pend[id]=v;save();$('pe-'+id).textContent='';$('pe-'+id).style.color='var(--ok)';$('pe-'+id).textContent='저장했어요';return;
}
if(t.id==='cp'){
var lines=D.pending.filter(function(p){return st.pend[p.id]}).map(function(p){return p.title+': '+st.pend[p.id]});
if(!lines.length){$('cm').textContent='입력한 소견이 아직 없어요.';return}
copyTxt=lines.join('\n');
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(copyTxt).then(function(){$('cm').textContent='복사했어요. 채팅에 붙여넣어 보내주세요.'}).catch(function(){$('cm').textContent=copyTxt})}
else $('cm').textContent=copyTxt;
}
});
$('p3').addEventListener('input',function(e){if(e.target.classList.contains('pa')){var m=$('pe-'+e.target.dataset.id);if(m)m.textContent=''}});
$('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(+b.dataset.t)});

var bkMsg='',bkPend=null;
function freshState(){return {ts:0,extra:[],cur:0,marks:{},srs:{},asg:{},pend:{},lec:{},lw:{},names:{},qlec:{},qscope:'all',terms:{},miss:[]}}
function bkSummary(s){
var m=0,mm=0;
for(var k in (s.marks||{})){(s.marks[k]||[]).forEach(function(x){if(x[2]==='mm')mm++;else m++})}
return '과목 '+((s.extra||[]).length)+'개 · 표시 '+m+'개 · 메모 '+mm+'개 · 복습 기록 '+Object.keys(s.srs||{}).length+'개';
}
function exportBackup(){
var json=JSON.stringify({app:'studyapp',v:1,at:Date.now(),st:st});
var f=new File([json],'study_backup_'+new Date().toISOString().slice(0,10)+'.txt',{type:'text/plain'});
if(navigator.canShare&&navigator.canShare({files:[f]})){
return navigator.share({files:[f],title:'공부 앱 백업'}).then(function(){bkMsg='백업을 내보냈어요. ('+bkSummary(st)+')'}).catch(function(er){if(er&&er.name==='AbortError'){bkMsg='';return}bkMsg='내보내지 못했어요. 다시 시도해주세요.'});
}
try{
var u=URL.createObjectURL(f),a=document.createElement('a');
a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(u)},4000);
bkMsg='백업 파일을 내려받았어요. ('+bkSummary(st)+')';
}catch(e){bkMsg='내보내지 못했어요.'}
return Promise.resolve();
}
$('fb').addEventListener('change',function(e){
var f=e.target.files&&e.target.files[0];
if(!f)return;
var r=new FileReader();
r.onload=function(){
try{var o=JSON.parse(r.result);if(!o||o.app!=='studyapp'||!o.st||typeof o.st!=='object')throw new Error('bad');bkPend=o.st;bkMsg=''}
catch(err){bkPend=null;bkMsg='백업 파일을 읽지 못했어요. 이 앱에서 내보낸 파일인지 확인해주세요.'}
renderHome();
};
r.onerror=function(){bkMsg='파일을 열지 못했어요.';renderHome()};
r.readAsText(f);
e.target.value='';
});
boot();
})();
</script>
